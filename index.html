<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고1 수학 · 함수와 원의 방정식</title>
<style>
:root{
  --paper:#F3F6FB; --surface:#FFFFFF; --ink:#131C2C; --line:#DBE3EF; --muted:#65748C;
  --a:#2A5FD9; --b:#0E9384; --hit:#6D28D9; --hit-soft:#F1EAFF; --wrong:#C2303A; --ok:#0E7C5A;
  --shadow:0 1px 2px rgba(19,28,44,.06), 0 8px 24px rgba(19,28,44,.06);
  --font-body:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --font-math:"Iowan Old Style","Times New Roman",Georgia,serif;
  --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:var(--font-body); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(rgba(42,95,217,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(42,95,217,.045) 1px,transparent 1px);
  background-size:26px 26px; line-height:1.65; -webkit-text-size-adjust:100%;
}
.wrap{max-width:740px;margin:0 auto;padding:20px 16px 80px}
header{padding:20px 2px 6px}
.eyebrow{font-family:var(--font-num);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
h1{font-family:var(--font-math);font-size:27px;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14.5px}

.group{margin:18px 0 4px}
.glabel{font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 7px;letter-spacing:.02em}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-family:var(--font-num);font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:99px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.solved::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--paper)}
.progress{font-size:12.5px;color:var(--muted);font-family:var(--font-num);margin:12px 2px 0}
.reset{margin-left:10px;font-family:var(--font-body);font-size:12px;color:#9AA6B8;background:none;border:none;padding:0;text-decoration:underline;letter-spacing:0}
.reset:hover{color:var(--wrong)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin:16px 0;box-shadow:var(--shadow);max-width:100%}
.card h2{font-size:13px;letter-spacing:.03em;margin:0 0 14px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::after{content:"";flex:1;height:1px;background:var(--line);order:1}
.redo{order:2;flex:none;font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:5px 11px;transition:all .15s}
.redo:hover{color:var(--ink);border-color:var(--ink)}
.redo:active{transform:scale(.96)}
.lv{font-family:var(--font-num);font-size:11px;color:#C9A227;letter-spacing:.1em}
.topic{font-family:var(--font-num);font-size:10.5px;background:var(--hit);color:#fff;padding:2px 8px;border-radius:99px;letter-spacing:.02em}

.math{font-family:var(--font-math);font-style:italic;font-size:19px}
.math sup{font-style:normal;font-size:.62em} .math sub{font-style:normal;font-size:.62em}
.give{background:#F7F9FD;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:4px 0 14px;overflow-x:auto}
.give div{margin:3px 0}
.ask{font-size:16px;margin:4px 0 14px}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;width:100%}
.choices.wide{grid-template-columns:1fr}
button{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(42,95,217,.15);-webkit-appearance:none;appearance:none}
.choice{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:13px 12px;font-size:16px;color:var(--ink);text-align:center;transition:border-color .15s,background .15s}
.choices.wide .choice{text-align:left}
.choice:hover:not(:disabled){border-color:var(--a);background:#F7FAFF}
.choice .num{font-family:var(--font-num);color:var(--muted);margin-right:7px;font-size:14px}
.choice.is-wrong{border-color:#F0C4C7;background:#FEF6F6;color:#9A5157;text-decoration:line-through}
.choice.is-right{border-color:var(--ok);background:#EEFAF4;color:var(--ok);font-weight:700}
.choice:disabled{cursor:default}
button:focus-visible{outline:2.5px solid var(--a);outline-offset:2px}

.fb{border-radius:12px;padding:15px 16px;margin-top:16px;font-size:14.5px;animation:rise .3s ease both}
.fb.miss{background:#FEF6F6;border:1px solid #F3CDD0}
.fb.hit{background:#EEFAF4;border:1px solid #BFE8D6}
.fb .fb-t{font-weight:800;margin:0 0 7px;font-size:15px}
.fb.miss .fb-t{color:var(--wrong)} .fb.hit .fb-t{color:var(--ok)}
.fb p{margin:0 0 8px} .fb p:last-child{margin-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hl{background:#FFF3C4;padding:0 4px;border-radius:3px;font-weight:700}
.kw{color:var(--hit);font-weight:700}
.small{font-size:13px;color:var(--muted)}

.btn{display:inline-block;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;margin-top:10px}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:600}
.btn.small{padding:8px 13px;font-size:13.5px;margin-top:0}

.viz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 6px;margin-top:14px;overflow:hidden}
.viz svg{width:100%;height:auto;display:block}

.step{border-top:1px solid var(--line);padding:18px 0 4px}
.step:first-of-type{border-top:none;padding-top:4px}
.step-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.step-n{font-family:var(--font-num);font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:3px 7px;flex:none}
.step.done .step-n{background:var(--ok)}
.step-q{font-size:15.5px;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--ink);word-break:keep-all}
.opt:hover:not(:disabled){border-color:var(--a);background:#F7FAFF}
.opt.is-wrong{border-color:#F0C4C7;background:#FEF6F6;color:#9A5157}
.opt.is-right{border-color:var(--ok);background:#EEFAF4;font-weight:700}
.opt:disabled{cursor:default}
.note{margin-top:10px;font-size:14px;background:#F7F9FD;border-left:3px solid var(--a);border-radius:0 8px 8px 0;padding:11px 13px;animation:rise .25s ease both}
.note.bad{border-left-color:var(--wrong);background:#FEF6F6}
.note.good{border-left-color:var(--ok);background:#F2FAF6}
.chk{margin-top:15px;border-top:1px dashed #A8DCC4;padding-top:14px}
.chk-t{font-weight:800;color:var(--ok);margin:0 0 9px;font-size:14.5px}
.chk .step-q{margin:0 0 4px}
.hint{margin-top:9px;font-size:13.5px;color:var(--muted);background:#FFFBEB;border:1px dashed #EFD98A;border-radius:9px;padding:10px 12px}
.locked{opacity:.35;pointer-events:none;filter:grayscale(.4)}
.warnbox{margin-top:6px;background:var(--hit-soft);border:1px solid #DDD0FA;border-radius:11px;padding:13px 15px;font-size:14px}
.warnbox b{color:var(--hit)}
.nojs{background:#FEF6F6;border:1px solid #F3CDD0;border-radius:12px;padding:14px;margin:16px 0;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 0}
.hidden{display:none}
@media (max-width:560px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choices.wide{grid-template-columns:1fr}.choice{padding:13px 8px;font-size:15px}}
@media (max-width:420px){h1{font-size:23px}.math{font-size:17px}.wrap{padding:12px 12px 60px}.card{padding:17px 13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<noscript><div class="nojs">이 페이지는 자바스크립트로 채점과 풀이 안내를 합니다. 크롬·사파리 같은 정식 브라우저로 열어 주세요.</div></noscript>
<div class="nojs hidden" id="jsWarn"></div>

<header>
  <p class="eyebrow">고1 수학</p>
  <h1>함수와 원의 방정식</h1>
  <p class="sub">정답을 알려주는 대신 생각하는 방법을 알려줍니다. 틀리면 왜 그 답이 나왔는지 짚고, 맞히면 왜 맞는지 되묻습니다.</p>
  <div class="group"><p class="glabel">함수</p><div class="chips" id="chipsA"></div></div>
  <div class="group"><p class="glabel">원의 방정식</p><div class="chips" id="chipsB"></div></div>
  <p class="progress" id="progress"></p>
</header>

<section class="card">
  <h2><span id="qLabel">문제</span> <span class="topic" id="qTopic"></span> <span class="lv" id="qLevel"></span><button class="redo" type="button" id="redoBtn">다시 풀기</button></h2>
  <div id="qBody"></div>
  <div class="choices" id="choices"></div>
  <div id="feedback"></div>
</section>

<section class="card hidden" id="vizCard">
  <h2>그림으로 보기</h2>
  <div class="viz"><div id="plot"></div></div>
  <p class="small" id="vizCap" style="padding:4px 4px 0"></p>
</section>

<section class="card hidden" id="guideCard">
  <h2>한 단계씩 풀어보기</h2>
  <div id="steps"></div>
</section>

<section class="card hidden" id="recapCard">
  <h2>이 문제에서 기억할 것</h2>
  <div class="warnbox" id="recapBody"></div>
  <button class="btn" type="button" id="nextBtn">다음 문제 풀기</button>
</section>

<footer>그림을 먼저 그려보는 습관이 도형·함수 단원의 전부입니다.</footer>
</div>

<script>
window.onerror=function(msg,src,ln){
  var w=document.getElementById('jsWarn');
  if(w){ w.className='nojs'; w.innerHTML='⚠️ 오류: '+msg+' (줄 '+ln+')'; }
  return false;
};
(function(){
"use strict";

var M=function(s){ return '<span class="math">'+s+'</span>'; };

/* ══════════════════════════════════════════════════════════════
   문제 데이터
   answer = 정답 선택지의 번호(0부터 시작)
   diag   = 각 선택지를 골랐을 때 나오는 진단 문구
   steps  = 단계별 유도 (right = 정답 보기 번호)
   ══════════════════════════════════════════════════════════════ */

var PROBLEMS=[
/* ───────── 1. 합성함수 (기초) ───────── */
{
 topic:'합성함수', group:0, level:1,
 give:['f(x) = 2x + 1','g(x) = x + 3'],
 ask:'두 함수가 위와 같을 때, '+M('(g∘f)(2)')+'의 값은?',
 choices:['5','8','10','11','13'], answer:1,
 diag:[
  {t:'한 단계가 남았습니다.',b:'5는 '+M('f(2)')+'의 값입니다. 여기서 멈추면 안 됩니다. 이 5를 다시 g에 넣어 '+M('g(5) = 5 + 3')+'까지 가야 끝납니다. 참고로 '+M('g(2)')+'도 5인데, 그것도 답이 아닙니다.'},
  null,
  {t:'합성을 덧셈으로 보셨습니다.',b:M('f(2) + g(2) = 5 + 5 = 10')+'을 계산하신 것 같습니다. 기호 '+M('∘')+'는 더하기가 아니라 <span class="kw">이어 붙이기</span>입니다. 앞 함수의 <b>결과</b>가 뒤 함수의 <b>입력</b>이 됩니다.'},
  {t:'순서가 반대입니다.',b:'11은 '+M('(f∘g)(2)')+'의 값입니다. '+M('g(2)=5')+', '+M('f(5)=11')+'이죠. 하지만 '+M('g∘f')+'는 <span class="hl">오른쪽에 붙은 f가 먼저</span>입니다. 괄호로 풀어 쓰면 '+M('g(f(2))')+'가 되어 안쪽부터 계산합니다.'},
  {t:'두 식을 하나로 섞으셨습니다.',b:'f의 2배와 g의 +3을 합쳐 '+M('2x + 3')+' 같은 식을 만들어 2를 넣으신 것 같습니다. 두 함수는 따로 계산해서 차례로 넘겨야 합니다.'}
 ],
 solved:M('f(2) = 2·2 + 1 = 5')+' → '+M('g(5) = 5 + 3 = 8'),
 recap:'<b>안쪽부터 계산합니다.</b> '+M('(g∘f)(x) = g(f(x))')+' — 괄호 안쪽의 f가 먼저 작동하고 그 결과가 g로 들어갑니다. 쓰인 순서와 계산 순서가 반대라서 가장 많이 틀립니다. 헷갈리면 <span class="kw">무조건 괄호로 풀어 쓰세요.</span>',
 steps:[
  {q:M('(g∘f)(2)')+'를 괄호로 풀어 쓰면?',
   o:[M('g(f(2))'),M('f(g(2))'),M('g(2) · f(2)')], right:0,
   w:['맞습니다. '+M('g∘f')+'는 f를 먼저 적용하고 그 결과를 g에 넣는다는 뜻입니다.',
      '순서가 반대입니다. 그건 '+M('f∘g')+'를 풀어 쓴 것입니다.',
      '합성은 곱셈이 아닙니다. 두 값을 곱하는 게 아니라 이어서 넣습니다.'],
   h:'기호 '+M('∘')+'의 <b>오른쪽</b>에 있는 함수가 먼저 작동합니다.'},
  {q:'그러면 '+M('f(2)')+'의 값은?',
   o:['5','4','3'], right:0,
   w:['맞습니다. '+M('f(2) = 2·2 + 1 = 5')+'입니다.',
      '+1을 빠뜨리셨습니다. '+M('2·2 = 4')+'에서 1을 더 더해야 합니다.',
      '식에 2를 그대로 넣어 보세요. '+M('2x + 1')+'에서 '+M('x=2')+'이면 '+M('4 + 1')+'입니다.'],
   h:M('f(x) = 2x + 1')+'의 x 자리에 2를 넣습니다.'},
  {q:'그 값 5를 g에 넣으면?',
   o:['8','2','15'], right:0,
   w:['맞습니다. '+M('g(5) = 5 + 3 = 8')+'입니다.',
      '빼기가 아니라 더하기입니다. '+M('g(x) = x + 3')+'입니다.',
      '곱하지 않습니다. g는 3을 더하는 함수입니다.'],
   h:M('g(x) = x + 3')+'의 x 자리에 앞에서 구한 5를 넣습니다.'}
 ]
},
/* ───────── 2. 역함수 (중간) ───────── */
{
 topic:'역함수', group:0, level:2,
 give:['f(x) = 2x − 3'],
 ask:'함수 f의 역함수를 '+M('f<sup>−1</sup>')+'이라 할 때, '+M('f<sup>−1</sup>(5)')+'의 값은?',
 choices:['1','4','5','7','13'], answer:1,
 diag:[
  {t:'부호가 반대입니다.',b:M('f<sup>−1</sup>(x) = (x + 3) / 2')+'인데 '+M('(x − 3) / 2')+'로 쓰신 것 같습니다. '+M('y = 2x − 3')+'에서 x만 남기려면 <span class="hl">3을 더해서</span> 옮깁니다. 넘어갈 때 부호가 바뀝니다.'},
  null,
  {t:'그대로 5를 답하셨습니다.',b:M('f<sup>−1</sup>(5)')+'는 "f에 넣었을 때 <span class="hl">5가 나오게 하는 값</span>"입니다. 5 자체가 아니라, 그 5를 만들어내는 입력값을 찾아야 합니다.'},
  {t:'역함수가 아니라 원래 함수에 넣으셨습니다.',b:M('f(5) = 2·5 − 3 = 7')+'을 계산하신 겁니다. '+M('f<sup>−1</sup>')+'은 <span class="kw">반대 방향</span>입니다. f가 4를 5로 보낸다면, '+M('f<sup>−1</sup>')+'은 5를 4로 되돌립니다.'},
  {t:'부호를 반대로 계산하셨습니다.',b:M('2·5 + 3 = 13')+'을 하신 것 같습니다. 역함수는 원래 식의 계수를 그대로 쓰는 게 아닙니다. 곱하기 2는 <b>나누기 2</b>가 됩니다.'}
 ],
 solved:M('f<sup>−1</sup>(5) = k')+'라 하면 '+M('f(k) = 5')+' → '+M('2k − 3 = 5')+' → '+M('k = 4'),
 recap:'<b>역함수는 되돌리는 함수입니다.</b> '+M('f<sup>−1</sup>(a) = b')+'와 '+M('f(b) = a')+'는 완전히 같은 말입니다. 역함수 식을 굳이 구하지 않아도, <span class="kw">"f에 뭘 넣어야 5가 나오지?"</span>라고 물으면 훨씬 빠르고 실수도 적습니다.',
 viz:{xr:[-2,9], yr:[-2,9], items:[
   {k:'line',a:1,b:-1,c:0,color:'#B7C1D2'},
   {k:'line',a:2,b:-1,c:-3,color:'#2A5FD9'},
   {k:'line',a:1,b:-2,c:3,color:'#0E9384'},
   {k:'point',x:4,y:5,label:'(4, 5)'},
   {k:'point',x:5,y:4,label:'(5, 4)'}
 ]},
 vizCap:'파란 선이 f, 초록 선이 역함수입니다. f가 4를 5로 보내면 역함수는 5를 4로 되돌립니다. 두 그래프는 회색 직선 '+M('y = x')+'에 대해 대칭입니다.',
 steps:[
  {q:M('f<sup>−1</sup>(5) = k')+'라고 두면, 어떤 식이 성립할까요?',
   o:[M('f(5) = k'),M('f(k) = 5'),M('k = 1 / f(5)')], right:1,
   w:['방향이 반대입니다. 역함수가 5를 k로 보낸다면, 원래 함수 f는 k를 5로 보냅니다.',
      '맞습니다. 역함수는 화살표를 거꾸로 돌린 것이라 '+M('f(k) = 5')+'가 됩니다.',
      '역함수는 역수(분수 뒤집기)가 아닙니다. 기호가 비슷하지만 전혀 다른 개념입니다.'],
   h:'f가 k를 5로 보낸다면, 그 화살표를 거꾸로 돌린 것이 역함수입니다.'},
  {q:'그러면 '+M('2k − 3 = 5')+'를 풀면 k는?',
   o:['4','1','8'], right:0,
   w:['맞습니다. '+M('2k = 8')+'이므로 '+M('k = 4')+'입니다.',
      '3을 넘길 때 부호를 확인하세요. '+M('2k = 5 + 3 = 8')+'입니다.',
      '2로 나누는 것을 빠뜨리셨습니다. '+M('2k = 8')+'에서 한 걸음 더 가야 합니다.'],
   h:'−3을 오른쪽으로 넘기면 +3이 됩니다. 그 다음 양변을 2로 나눕니다.'},

/* ══════════ 좌표평면 그리기 ══════════ */
function plot(sp){
  if(!sp) return '';
  var xr=sp.xr, yr=sp.yr, items=sp.items||[];
  var xs=xr[1]-xr[0], ys=yr[1]-yr[0];
  var PW=520, sc=PW/xs, PH=ys*sc;
  if(PH>400){ sc=400/ys; PH=400; PW=xs*sc; }
  var W=660, ox=(W-PW)/2, oy=26, H=PH+52;
  function X(v){ return ox+(v-xr[0])*sc; }
  function Y(v){ return oy+(yr[1]-v)*sc; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="좌표평면">';
  var i;
  /* 격자 */
  for(i=Math.ceil(xr[0]);i<=Math.floor(xr[1]);i++)
    s+='<line x1="'+X(i)+'" y1="'+oy+'" x2="'+X(i)+'" y2="'+(oy+PH)+'" stroke="#E8EDF6" stroke-width="1"/>';
  for(i=Math.ceil(yr[0]);i<=Math.floor(yr[1]);i++)
    s+='<line x1="'+ox+'" y1="'+Y(i)+'" x2="'+(ox+PW)+'" y2="'+Y(i)+'" stroke="#E8EDF6" stroke-width="1"/>';
  /* 축 */
  if(yr[0]<=0&&yr[1]>=0) s+='<line x1="'+ox+'" y1="'+Y(0)+'" x2="'+(ox+PW)+'" y2="'+Y(0)+'" stroke="#8895AB" stroke-width="1.4"/>';
  if(xr[0]<=0&&xr[1]>=0) s+='<line x1="'+X(0)+'" y1="'+oy+'" x2="'+X(0)+'" y2="'+(oy+PH)+'" stroke="#8895AB" stroke-width="1.4"/>';
  /* 눈금 숫자 */
  var ty=(yr[0]<=0&&yr[1]>=0)?Y(0):oy+PH;
  for(i=Math.ceil(xr[0]);i<=Math.floor(xr[1]);i++) if(i!==0&&i%2===0)
    s+='<text x="'+X(i)+'" y="'+(ty+15)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#8895AB">'+i+'</text>';
  var tx=(xr[0]<=0&&xr[1]>=0)?X(0):ox;
  for(i=Math.ceil(yr[0]);i<=Math.floor(yr[1]);i++) if(i!==0&&i%2===0)
    s+='<text x="'+(tx-8)+'" y="'+(Y(i)+4)+'" text-anchor="end" font-size="11" font-family="ui-monospace,monospace" fill="#8895AB">'+i+'</text>';

  items.forEach(function(it){
    var c=it.color||'#2A5FD9';
    if(it.k==='circle'){
      s+='<circle cx="'+X(it.cx)+'" cy="'+Y(it.cy)+'" r="'+(it.r*sc)+'" fill="'+c+'" fill-opacity=".07" stroke="'+c+'" stroke-width="2.4"/>';
    }else if(it.k==='seg'){
      s+='<line x1="'+X(it.x1)+'" y1="'+Y(it.y1)+'" x2="'+X(it.x2)+'" y2="'+Y(it.y2)+'" stroke="'+c+'" stroke-width="2.4"/>';
    }else if(it.k==='line'){
      var p=[];
      if(it.b!==0){ p.push([xr[0],-(it.a*xr[0]+it.c)/it.b]); p.push([xr[1],-(it.a*xr[1]+it.c)/it.b]); }
      else { p.push([-it.c/it.a,yr[0]]); p.push([-it.c/it.a,yr[1]]); }
      s+='<line x1="'+X(p[0][0])+'" y1="'+Y(p[0][1])+'" x2="'+X(p[1][0])+'" y2="'+Y(p[1][1])+'" stroke="'+c+'" stroke-width="2.4"/>';
    }else if(it.k==='asymV'){
      s+='<line x1="'+X(it.x)+'" y1="'+oy+'" x2="'+X(it.x)+'" y2="'+(oy+PH)+'" stroke="#6D28D9" stroke-width="1.6" stroke-dasharray="6 5"/>';
    }else if(it.k==='asymH'){
      s+='<line x1="'+ox+'" y1="'+Y(it.y)+'" x2="'+(ox+PW)+'" y2="'+Y(it.y)+'" stroke="#6D28D9" stroke-width="1.6" stroke-dasharray="6 5"/>';
    }else if(it.k==='fn'){
      it.dom.forEach(function(d){
        var pts=[], n=140;
        for(var j=0;j<=n;j++){
          var x=d[0]+(d[1]-d[0])*j/n, y=it.f(x);
          if(!isFinite(y)||y<yr[0]-2||y>yr[1]+2){ if(pts.length>1) s+=path(pts,c); pts=[]; continue; }
          pts.push([X(x),Y(y)]);
        }
        if(pts.length>1) s+=path(pts,c);
      });
    }else if(it.k==='point'){
      s+='<circle cx="'+X(it.x)+'" cy="'+Y(it.y)+'" r="5.5" fill="#6D28D9" stroke="#fff" stroke-width="2"/>';
      if(it.label) s+='<text x="'+(X(it.x)+10)+'" y="'+(Y(it.y)-9)+'" font-size="12.5" font-family="ui-monospace,monospace" fill="#6D28D9" font-weight="700">'+it.label+'</text>';
    }
  });
  return s+'</svg>';
}
function path(pts,c){
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=1;i<pts.length;i++) d+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
  return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round"/>';
}

/* ══════════ 화면 ══════════ */
var CH=['①','②','③','④','⑤'];
var elA=document.getElementById('chipsA'), elB=document.getElementById('chipsB'), elProg=document.getElementById('progress');
var elLabel=document.getElementById('qLabel'), elTopic=document.getElementById('qTopic'), elLevel=document.getElementById('qLevel'), elBody=document.getElementById('qBody');
var elChoices=document.getElementById('choices'), elFb=document.getElementById('feedback');
var elVizCard=document.getElementById('vizCard'), elPlot=document.getElementById('plot'), elCap=document.getElementById('vizCap');
var elGuide=document.getElementById('guideCard'), elSteps=document.getElementById('steps');
var elRecap=document.getElementById('recapCard'), elRecapB=document.getElementById('recapBody'), elNext=document.getElementById('nextBtn');
var solved={}, cur=0, restored=false;

/* 진행 상황 저장 — 문제 세트가 바뀌면 자동으로 초기화됩니다 */
var KEY='math-progress-v1';
var SIG=PROBLEMS.map(function(P){ return P.topic+':'+P.answer; }).join('|');
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({sig:SIG, solved:solved})); }catch(e){}
}
function load(){
  try{
    var r=JSON.parse(localStorage.getItem(KEY)||'null');
    if(r && r.sig===SIG) return r;
  }catch(e){}
  return null;
}
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function up(node,match){ while(node&&node.nodeType){ if(node.nodeType===1&&match(node)) return node; node=node.parentNode; } return null; }

function renderChips(){
  elA.innerHTML=''; elB.innerHTML='';
  PROBLEMS.forEach(function(P,i){
    var b=document.createElement('button');
    b.type='button'; b.className='chip'+(i===cur?' on':'')+(solved[i]?' solved':'');
    b.innerHTML=(i+1);
    b.onclick=(function(n){ return function(){ show(n); window.scrollTo({top:0,behavior:'smooth'}); }; })(i);
    (P.group===0?elA:elB).appendChild(b);
  });
  var c=0; for(var k in solved) c++;
  elProg.innerHTML=(restored&&c>0?'이어서 풀기 · ':'')+c+' / '+PROBLEMS.length+' 완료'+
    (c>0?' <button class="reset" type="button" id="resetBtn">진행 초기화</button>':'');
  var rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=function(){
    solved={}; restored=false; wipe();
    show(0); window.scrollTo({top:0,behavior:'smooth'});
  };
  save();
}

function show(i){
  cur=i; renderChips();
  var P=PROBLEMS[i];
  elGuide.classList.add('hidden'); elRecap.classList.add('hidden'); elSteps.innerHTML=''; elFb.innerHTML='';
  elLabel.innerHTML='문제 '+(i+1); elTopic.innerHTML=P.topic;
  elLevel.innerHTML=['','★☆☆ 기초','★★☆ 중간','★★★ 생각'][P.level||1];

  var g='<div class="give">';
  P.give.forEach(function(t){ g+='<div class="math">'+t+'</div>'; });
  g+='</div><p class="ask">'+P.ask+'</p>';
  elBody.innerHTML=g;

  elChoices.className='choices'+(P.wide?' wide':'');
  elChoices.innerHTML='';
  P.choices.forEach(function(t,j){
    var b=document.createElement('button');
    b.type='button'; b.className='choice';
    b.innerHTML='<span class="num">'+CH[j]+'</span>'+t;
    b.onclick=(function(idx,btn){ return function(){ pick(idx,btn); }; })(j,b);
    elChoices.appendChild(b);
  });

  if(P.viz){ elVizCard.classList.remove('hidden'); elPlot.innerHTML=''; elCap.innerHTML='정답을 맞히거나 단계별 풀이를 진행하면 그림이 나타납니다.'; }
  else elVizCard.classList.add('hidden');
}

function showViz(P){
  if(!P.viz) return;
  elVizCard.classList.remove('hidden');
  try{ elPlot.innerHTML=plot(P.viz); }catch(e){ elPlot.innerHTML=''; }
  elCap.innerHTML=P.vizCap||'';
}

function pick(j,btn){
  if(btn.disabled) return;
  var P=PROBLEMS[cur];
  if(j===P.answer){
    btn.classList.add('is-right'); lockAll();
    elFb.innerHTML='<div class="fb hit"><p class="fb-t">정답입니다</p><p>'+P.solved+'</p>'+
      '<div id="checkBox"></div></div>';
    showViz(P);
    renderCheck(P);
    return;
  }
  btn.classList.add('is-wrong'); btn.disabled=true;
  var d=P.diag[j]||{t:'아직 아닙니다.',b:'문제의 조건을 다시 하나씩 확인해 보세요.'};
  elFb.innerHTML='<div class="fb miss"><p class="fb-t">'+d.t+'</p><p>'+d.b+'</p>'+
    '<p class="small">다시 한 번 골라 보세요.</p>'+
    '<button class="btn small" type="button" id="goGuide">한 단계씩 같이 풀기</button></div>';
  document.getElementById('goGuide').onclick=openGuide;
}
function renderCheck(P){
  var c=P.check, box=document.getElementById('checkBox');
  if(!c||!box){ solved[cur]=1; renderChips(); finish(P); return; }
  var h='<div class="chk"><p class="chk-t">한 가지만 더 — 왜 그런지도 알고 계신가요?</p>'+
        '<p class="step-q">'+c.q+'</p><div class="opts">';
  c.o.forEach(function(o,j){ h+='<button class="opt" type="button" data-c="'+j+'">'+o+'</button>'; });
  h+='</div><div id="chkNote"></div></div>';
  box.innerHTML=h;
  box.onclick=function(e){
    var t=up(e.target,function(n){ return n.tagName==='BUTTON'&&n.getAttribute('data-c')!==null; });
    if(!t||t.disabled) return;
    checkAns(P,+t.getAttribute('data-c'),t);
  };
}
function checkAns(P,j,btn){
  var c=P.check, note=document.getElementById('chkNote');
  if(j===c.right){
    btn.classList.add('is-right');
    var sib=btn.parentNode.getElementsByTagName('button');
    for(var k=0;k<sib.length;k++) sib[k].disabled=true;
    note.innerHTML='<div class="note good">'+c.w[j]+'</div>'+
      '<button class="btn small" type="button" id="showSolve" style="margin-top:11px">풀이 과정 다시 보기</button>';
    document.getElementById('showSolve').onclick=openGuide;
    solved[cur]=1; renderChips(); finish(P);
  }else{
    btn.classList.add('is-wrong'); btn.disabled=true;
    note.innerHTML='<div class="note bad">'+c.w[j]+'<br><span class="small">답 자체는 맞았습니다. 이유만 다시 골라 보세요.</span></div>';
  }
}
function lockAll(){
  var l=elChoices.getElementsByTagName('button');
  for(var i=0;i<l.length;i++) l[i].disabled=true;
}
function finish(P){
  elRecapB.innerHTML=P.recap;
  elRecap.classList.remove('hidden');
  elNext.innerHTML=(cur+1<PROBLEMS.length)?'다음 문제 풀기':'첫 문제로 돌아가기';
}

function openGuide(){
  var P=PROBLEMS[cur];
  elGuide.classList.remove('hidden');
  if(!elSteps.innerHTML) buildSteps(P);
  elGuide.scrollIntoView({behavior:'smooth',block:'start'});
}
function buildSteps(P){
  P.steps.forEach(function(st,i){
    var d=document.createElement('div');
    d.className='step'+(i>0?' locked':''); d.id='st'+i;
    var h='<div class="step-head"><span class="step-n">STEP '+(i+1)+'</span><p class="step-q">'+st.q+'</p></div><div class="opts">';
    st.o.forEach(function(o,j){ h+='<button class="opt" type="button" data-i="'+i+'" data-j="'+j+'">'+o+'</button>'; });
    h+='</div><button class="btn ghost small" type="button" data-hint="'+i+'" style="margin-top:9px">힌트 보기</button>'+
       '<div class="hint hidden" id="hint'+i+'">'+st.h+'</div><div id="note'+i+'"></div>';
    d.innerHTML=h; elSteps.appendChild(d);
  });
  elSteps.onclick=function(e){
    var t=up(e.target,function(n){ return n.tagName==='BUTTON'; });
    if(!t||t.disabled) return;
    if(t.getAttribute('data-hint')!==null){ document.getElementById('hint'+t.getAttribute('data-hint')).classList.toggle('hidden'); return; }
    if(t.getAttribute('data-i')!==null) stepAns(P,+t.getAttribute('data-i'),+t.getAttribute('data-j'),t);
  };
}
function stepAns(P,i,j,btn){
  var st=P.steps[i], note=document.getElementById('note'+i);
  if(j===st.right){
    btn.classList.add('is-right');
    document.getElementById('st'+i).classList.add('done');
    var sib=btn.parentNode.getElementsByTagName('button');
    for(var k=0;k<sib.length;k++) sib[k].disabled=true;
    note.innerHTML='<div class="note good">'+st.w[j]+'</div>';
    var nx=document.getElementById('st'+(i+1));
    if(nx){ nx.classList.remove('locked'); nx.scrollIntoView({behavior:'smooth',block:'center'}); }
    else{
      note.innerHTML+='<div class="note good" style="margin-top:8px">여기까지가 한 문제의 전체 흐름입니다.</div>';
      solved[cur]=1; renderChips(); lockAll();
      var l=elChoices.getElementsByTagName('button');
      if(l[P.answer]) l[P.answer].classList.add('is-right');
      showViz(P); finish(P);
    }
  }else{
    btn.classList.add('is-wrong'); btn.disabled=true;
    note.innerHTML='<div class="note bad">'+st.w[j]+'<br><span class="small">다시 골라 보세요.</span></div>';
  }
}

elNext.onclick=function(){ show((cur+1)%PROBLEMS.length); window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('redoBtn').onclick=function(){
  show(cur);
  elBody.parentNode.scrollIntoView({behavior:'smooth',block:'start'});
};

var st=load();
if(st && st.solved){ solved=st.solved; restored=true; }
var first=0;
for(var i=0;i<PROBLEMS.length;i++){ if(!solved[i]){ first=i; break; } }
show(first);
})();
</script>
